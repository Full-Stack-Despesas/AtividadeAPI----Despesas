services:
  db:
    image: mysql:8.4
    container_name: despesas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expenses
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    ports:
      # 3307 no host para não conflitar com um MySQL local na 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp123"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - despesas-net

  api:
    build: .
    container_name: despesas-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "db" é o nome do serviço acima: o DNS interno do Docker resolve para o container do MySQL
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: expenses
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
      JWT_SECRET: ${JWT_SECRET:-segredo}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - "3000:3000"
    networks:
      - despesas-net

volumes:
  db_data:

networks:
  despesas-net:
